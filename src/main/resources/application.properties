spring:
    application:
        name: restaurant
    datasource:
        url: jdbc:h2:mem:restaurantsdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
        username: sa
        password:
        driver-class-name: org.h2.Driver
    jpa:
        hibernate:
        ddl-auto: update
        show-sql: false

app:
    csv:
        restaurants: resources/data/restaurants.csv

springdoc:
    api-docs:
        path: /v3/api-docs
    swagger-ui:
        path: /swagger-ui.html